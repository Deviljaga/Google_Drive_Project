# Application Name
spring.application.name=API-GATEWA

# Server Port
server.port=8080

# Eureka Server Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Drive Service Route
spring.cloud.gateway.routes[0].id=drive-service
spring.cloud.gateway.routes[0].uri=lb://Drive-Service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/files,/api/files/**

# Sharing Service Route
spring.cloud.gateway.routes[1].id=sharing-service
spring.cloud.gateway.routes[1].uri=lb://Sharing-Service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/shares,/api/shares/**

# CORS Configuration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[0]=http://localhost:5500
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[1]=http://127.0.0.1:5500

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[0]=GET
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[1]=POST
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[2]=PUT
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[3]=DELETE
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[4]=OPTIONS

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers[0]=*

# Eureka Instance Configuration
eureka.instance.prefer-ip-address=true
